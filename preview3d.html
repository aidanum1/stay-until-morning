<!doctype html>
<!-- dev-only: 3D quality test viewer (not part of the production build) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0a0d1e;overflow:hidden}canvas{display:block}#i{position:fixed;left:8px;top:8px;color:#9ff3ff;font:12px monospace;white-space:pre}</style></head>
<body><div id="i">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(Math.min(2, devicePixelRatio)); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#0a0d1e');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight('#fff4e6', 2.2); key.position.set(1.5, 2.5, 3); scene.add(key);
const rim = new THREE.DirectionalLight('#8fd8ff', 2.5); rim.position.set(-2, 2, -3); scene.add(rim);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 100);
new GLTFLoader().load('./assets/generated/3d/hamin.glb', (g) => {
  const m = g.scene; scene.add(m);
  const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  m.position.sub(c); const H = s.y;
  let tris = 0, bones = 0, tex = new Set();
  m.traverse((o) => { if (o.isMesh) { tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; const mt = o.material; for (const k of ['map','normalMap','roughnessMap','metalnessMap']) if (mt[k]) tex.add(k + ' ' + mt[k].image.width); } if (o.isBone) bones++; });
  document.getElementById('i').textContent = `tris ${Math.round(tris)}\nbones ${bones}\nanims ${g.animations.length}\n${[...tex].join('\n')}\nsize ${s.x.toFixed(2)} ${s.y.toFixed(2)} ${s.z.toFixed(2)}`;
  const view = q.get('view') || 'full', ang = parseFloat(q.get('a') || '0.35');
  const ty = view === 'face' ? H * 0.41 : view === 'bust' ? H * 0.3 : 0;
  const d = view === 'face' ? H * 0.55 : view === 'bust' ? H * 1.2 : H * 2.6;
  const spin = q.get('spin');
  const loop = (t) => { const a = spin ? t / 1500 : ang; cam.position.set(Math.sin(a) * d, ty, Math.cos(a) * d); cam.lookAt(0, ty, 0); r.render(scene, cam); requestAnimationFrame(loop); };
  loop(0);
}, undefined, (e) => { document.getElementById('i').textContent = 'error ' + e.message; });
</script></body></html>
